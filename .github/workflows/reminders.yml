name: Recordatorios
# Llama cada hora al endpoint de recordatorios. El servidor decide a quién avisar
# según la hora de Madrid y las preferencias de cada persona.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorios
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Falta el secreto APP_URL, nada que hacer"; exit 0; fi
          curl -fsS -X POST "$APP_URL/api/cron/reminders" -H "Authorization: Bearer $CRON_SECRET"
